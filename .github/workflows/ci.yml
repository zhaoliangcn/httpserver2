name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  linux:
    name: Linux (GCC / CMake)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libboost-dev \
            libssl-dev \
            libnghttp2-dev \
            libsqlite3-dev \
            zlib1g-dev \
            cmake \
            ninja-build \
            git

      # PipeYAML 替代了 yaml-cpp，但两者都不在发行版的软件源里
      # （apt 没有 libpipeyaml，vcpkg 也没有对应 port），只能从源码构建。
      # 它是纯静态库，构建产物不需要额外拷贝运行时依赖。
      - name: Build PipeYAML
        run: |
          git clone --depth 1 https://github.com/zhaoliangcn/PipeYAML.git /tmp/PipeYAML
          cmake -S /tmp/PipeYAML -B /tmp/PipeYAML/build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPYPEYAML_BUILD_TESTS=OFF \
            -DPYPEYAML_BUILD_BENCHMARKS=OFF
          cmake --build /tmp/PipeYAML/build
          cmake --install /tmp/PipeYAML/build --prefix /tmp/PipeYAML-install

      # 依赖查找顺序：
      #   1) find_package 走系统安装（libssl-dev 等提供 cmake config）
      #   2) 找不到时回退到 HS2_DEPS_ROOT 下的本地目录
      # Ubuntu 上系统包版本可能低于 3.0，OpenSSL 单独指定根目录。
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DHS2_DEPS_ROOT="${GITHUB_WORKSPACE}/.." \
            -DHS2_OPENSSL_ROOT=/usr \
            -DHS2_PIPEYAML_ROOT=/tmp/PipeYAML-install

      - name: Build
        run: cmake --build build --target httpserver2 test_unit

      - name: Run unit tests
        run: ./build/bin/test_unit

  windows:
    name: Windows (MSVC / CMake)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC
        uses: microsoft/setup-msbuild@v2

      - name: Install dependencies
        shell: pwsh
        run: |
          # vcpkg 提供 OpenSSL / zlib / sqlite3 / nghttp2 的 Windows 版
          # 头文件与库。Boost 只用 header-only 部分，vcpkg 的 boost-asio 头即可。
          # PipeYAML 不在 vcpkg 的 port 列表里，单独从源码构建。
          vcpkg install boost-asio:x64-windows-static `
            openssl:x64-windows-static `
            zlib:x64-windows-static `
            sqlite3:x64-windows-static `
            nghttp2:x64-windows-static
          Write-Host "VCPKG_ROOT=$env:VCPKG_ROOT"

      - name: Build PipeYAML
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/zhaoliangcn/PipeYAML.git $env:RUNNER_TEMP\PipeYAML
          cmake -S "$env:RUNNER_TEMP\PipeYAML" -B "$env:RUNNER_TEMP\PipeYAML\build" `
            -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DPYPEYAML_BUILD_TESTS=OFF `
            -DPYPEYAML_BUILD_BENCHMARKS=OFF
          cmake --build "$env:RUNNER_TEMP\PipeYAML\build" --config Release
          cmake --install "$env:RUNNER_TEMP\PipeYAML\build" --config Release --prefix "$env:RUNNER_TEMP\PipeYAML-install"

      - name: Configure
        shell: pwsh
        run: |
          # VCPKG_ROOT 指向 vcpkg 安装目录，其 installed/x64-windows 里有完整的
          # include/ 与 lib/ 布局，CMake 的 find_package 能直接定位。
          cmake -S . -B build -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DCMAKE_BUILD_TYPE=Release `
            -DHS2_BOOST_ROOT="$env:VCPKG_ROOT/installed/x64-windows/include" `
            -DHS2_PIPEYAML_ROOT="$env:RUNNER_TEMP/PipeYAML-install" `
            -DHS2_NGHTTP2_ROOT="$env:VCPKG_ROOT/installed/x64-windows" `
            -DHS2_TINYDB_ROOT="$env:VCPKG_ROOT/installed/x64-windows"

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --target httpserver2 test_unit

      - name: Run unit tests
        shell: pwsh
        run: .\build\bin\Release\test_unit.exe

  lint:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check C++ formatting
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format
          find . -name '*.cpp' -o -name '*.h' | xargs clang-format --dry-run --Werror 2>&1 || true
